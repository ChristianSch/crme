app = "your-crme-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.api"

[env]
  APP_ENV = "prod"
  HTTP_ADDR = ":8080"
  LOG_LEVEL = "info"
  LOG_FORMAT = "json"
  HOUSEKEEPING_INTERVAL = "1h"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
