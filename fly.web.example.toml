app = "your-crme-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.web"

  [build.args]
    NEXT_PUBLIC_API_URL = "/api"
    CRME_API_URL = "http://your-crme-api.internal:8080"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_PUBLIC_API_URL = "/api"
  CRME_API_URL = "http://your-crme-api.internal:8080"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
